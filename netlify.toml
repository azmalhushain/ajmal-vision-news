[build]
  command = "npm run build"
  publish = "dist"

# RSS feed proxied to the rss-feed edge function (must come BEFORE SPA fallback)
[[redirects]]
  from = "/rss.xml"
  to = "https://kpswxkuzfnafsqeqaunt.supabase.co/functions/v1/rss-feed"
  status = 200
  force = true

# Sitemap proxied to the sitemap edge function
[[redirects]]
  from = "/sitemap.xml"
  to = "https://kpswxkuzfnafsqeqaunt.supabase.co/functions/v1/sitemap"
  status = 200
  force = true

# SPA fallback — every unknown path serves index.html so React Router can handle it
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term cache for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security + SEO friendly headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
